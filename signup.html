<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Project Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./auth.js"></script>
    <style>
      .auth-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .auth-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 30px;
      }
      .auth-header h1 {
        font-size: 24px;
        color: var(--text-main);
        margin-bottom: 8px;
      }
      .auth-header p {
        color: var(--text-muted);
        font-size: 14px;
      }
      .auth-links {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        font-size: 14px;
      }
      .auth-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        margin-left: 5px;
      }
      .auth-links a:hover {
        text-decoration: underline;
      }
      .error-message {
        color: #ef4444;
        background: #fee2e2;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
      }
      .input-group input {
        width: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <div class="hero-logo" style="justify-content: center; margin-bottom: 20px;">
              <div class="hero-logo-icon">
                <span class="logo-dot dot-1"></span>
                <span class="logo-dot dot-2"></span>
                <span class="logo-dot dot-3"></span>
                <span class="logo-dot dot-4"></span>
                <span class="logo-line line-1"></span>
                <span class="logo-line line-2"></span>
                <span class="logo-line line-3"></span>
              </div>
              <div class="hero-logo-wordmark">
                <span class="logo-square">n</span><span class="logo-text">Connect</span>
              </div>
            </div>
            <h1>Create an Account</h1>
            <p>Sign up to access the project dashboard</p>
          </div>

          <div id="errorMessage" class="error-message"></div>

          <form id="signupForm" class="form-grid" style="display: block;">
            <div class="input-group" style="margin-bottom: 20px;">
              <label for="email">Email</label>
              <input id="email" type="email" required placeholder="you@company.com" />
            </div>
            
            <div class="input-group" style="margin-bottom: 24px;">
              <label for="password">Password</label>
              <input id="password" type="password" required placeholder="••••••••" minlength="6" />
            </div>

            <button type="submit" class="primary-button" style="width: 100%; justify-content: center;">Sign Up</button>
            
            <div class="auth-links">
              Already have an account? <a href="./login.html">Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const signupForm = document.getElementById("signupForm");
      const errorMessage = document.getElementById("errorMessage");

      function getApiBaseUrl() {
        const { hostname } = window.location;
        if (hostname === "localhost" || hostname === "127.0.0.1") {
          return "http://localhost:4000/api";
        }
        return "https://api.nconnect.co.in/api";
      }

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const submitBtn = signupForm.querySelector("button[type='submit']");
        
        try {
          submitBtn.disabled = true;
          submitBtn.textContent = "Creating Account...";
          errorMessage.style.display = "none";

          const response = await fetch(`${getApiBaseUrl()}/auth/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Signup failed");
          }

          // Save auth data and redirect
          saveAuthData(data.token, data.user);
          window.location.href = "./index.html";
          
        } catch (error) {
          errorMessage.textContent = error.message;
          errorMessage.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign Up";
        }
      });
    </script>
  </body>
</html>
